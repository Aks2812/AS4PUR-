# AS4PUR reverse proxy for the Docker setup (docker-compose.yml).
# Same TLS profile, limits and upload size as deploy/nginx_as4pur.conf - see
# that file for the reasoning behind each value. Differences: it proxies to
# the "app" container instead of 127.0.0.1, answers any host name, reads the
# certificate from /etc/nginx/certs (deploy/docker/certs on the host), and
# sets proxy_read_timeout 300s for long Data Export runs (README, "nginx notes").

limit_req_zone $binary_remote_addr zone=as4pur_general:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=as4pur_login:1m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=as4pur_conn:1m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.3;

    client_max_body_size 55m;
    limit_conn as4pur_conn 20;

    location = /login {
        limit_req zone=as4pur_login burst=5 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        limit_req zone=as4pur_general burst=30 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
