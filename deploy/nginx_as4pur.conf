# AS4PUR reverse proxy - terminates TLS, forwards to the single-process
# Uvicorn instance on 127.0.0.1:8000 (see as4pur.service). Self-signed or
# an internal CA cert is fine (CLAUDE.md Section 5) - the point is that
# nothing, including the Netskope API token entered in the browser, ever
# crosses the LAN in cleartext.

# Rate/connection limiting (2026-09-13 host-hardening pass) - defense-in-
# depth beyond the app's own login-only, in-memory, restart-resetting
# limiter (app/security/rate_limit.py). limit_req_zone/limit_conn_zone
# must live outside any server{} block - this file is included into
# nginx.conf's http{} context via sites-enabled, so top-level directives
# here land in the right place automatically.
#
# as4pur_general: every request (including static assets - this app has
# no separate Nginx-served static location, everything proxies to
# Uvicorn). 10r/s comfortably covers several operators each polling a job
# status every 2s (app/static/js/job-poll.js, CLAUDE.md Section 2's "low
# concurrency, single/few operators") plus normal navigation; burst=30
# absorbs one page load's worth of near-simultaneous asset requests
# (HTML+CSS+JS). Starting point, not a final answer - once the server is
# live, watch Nginx's error log for "limiting requests, excess:" during
# real multi-operator use and raise these numbers if legitimate traffic
# ever gets throttled.
#
# as4pur_login: tighter, applied to /login only below - NOT a replacement
# for the app's own per-username-aware 5-attempts/15-minutes limiter
# (still the primary brute-force control), just a backstop so a raw
# high-volume automated flood never even reaches Uvicorn's single worker
# process. 1r/s with a small burst is still far looser than the app's own
# threshold, deliberately - Nginx should stop an actual flood, not hand a
# real user an unfriendly 503 after a couple of mistyped-password
# retries.
#
# Zone sizes (1m each) track ~16,000 distinct IPs per zone (64 bytes per
# $binary_remote_addr entry) - already far more than this internal,
# few-operator tool will ever see; picked as a small, standard value, not
# because this scale is expected.
#
# UNCONFIRMED, worth checking once live: if AS4PUR is ever reached through
# Netskope Private Access in a way that collapses every user's traffic to
# one apparent source IP at the publisher hop, these per-IP limits would
# apply to the WHOLE user population as one shared bucket, not per person
# - another reason these start generous rather than tight. Check
# $remote_addr in an access log during normal multi-operator use before
# tightening either number.
limit_req_zone $binary_remote_addr zone=as4pur_general:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=as4pur_login:1m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=as4pur_conn:1m;

server {
    listen 80;
    server_name as4pur.internal;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name as4pur.internal;
    server_tokens off;

    ssl_certificate     /etc/ssl/as4pur/fullchain.pem;
    ssl_certificate_key /etc/ssl/as4pur/privkey.pem;

    # TLS profile (2026-09-13, Mozilla SSL Configuration Generator
    # guidelines v5.7 - https://ssl-config.mozilla.org/guidelines/5.7.json,
    # fetched directly rather than hand-typed): MODERN (TLS 1.3 only), not
    # Intermediate - chosen deliberately for this specific deployment.
    # AS4PUR is reached only through Netskope Client (ZTNA) by a known,
    # small, centrally managed client population - no legacy-browser or
    # unmanaged-device compatibility need, exactly the case Mozilla's own
    # guidance says Modern is for. TLS 1.3 has been supported by every
    # current browser/OS TLS stack since ~2020.
    #
    # No ssl_ciphers/ssl_prefer_server_ciphers line is needed for Modern -
    # TLS 1.3 doesn't use the legacy cipher-suite negotiation those
    # directives control; OpenSSL's built-in TLS 1.3 suite set already IS
    # Mozilla's Modern list (TLS_AES_128_GCM_SHA256, TLS_AES_256_GCM_SHA384,
    # TLS_CHACHA20_POLY1305_SHA256) on any current nginx/OpenSSL build.
    #
    # Trade-off, stated plainly: Modern has NO fallback - a client that
    # can't do TLS 1.3 (a dated CLI tool, an interception proxy with an
    # old TLS stack, etc.) gets a hard handshake failure, not a
    # slower-but-working connection. If that ever turns out to matter,
    # switch to the Intermediate block below instead - also pulled
    # directly from the same Mozilla v5.7 guidelines, not hand-typed:
    #
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    # ssl_prefer_server_ciphers off;
    ssl_protocols TLSv1.3;

    # Deliberately NOT copying the rest of Mozilla's template here:
    # - HSTS (add_header Strict-Transport-Security ...) - already set
    #   unconditionally by the app's own SecurityHeadersMiddleware
    #   (CLAUDE.md Section 9); adding it here too would duplicate it -
    #   exactly the conflict the last host-hardening review checked for.
    # - OCSP stapling (ssl_stapling on + ssl_trusted_certificate) -
    #   meaningless against the self-signed/internal-CA cert this
    #   deployment actually uses (deploy/README_DEPLOY.md step 6) unless a
    #   real CA chain file is set up to match; adding it without one would
    #   just produce an `nginx -t` warning.
    # - ssl_session_cache/ssl_session_tickets - a real optimization, but
    #   out of scope for a cipher-hardening pass at this app's real (very
    #   small) traffic volume.

    # A little above the LARGEST app-side upload limit so Nginx isn't the
    # thing that rejects an upload before the app gets a chance to give a
    # clear error - Nginx's own 413 is a bare HTML error page with no
    # explanation. That's AS4PUR_NSDEBUG_UPLOAD_MAX_BYTES (50MB, Device
    # Posture nsdebug.log uploads), not AS4PUR_UPLOAD_MAX_BYTES (10MB,
    # Excel/CSV operations) any more. If either setting is raised, raise
    # this with it, then `sudo nginx -t && sudo systemctl reload nginx`.
    client_max_body_size 55m;
    limit_conn as4pur_conn 20;

    # Same proxy_pass/proxy_set_header lines as location / below,
    # deliberately duplicated rather than factored out - this file stays
    # small enough that explicit beats clever here (CLAUDE.md Section 4).
    location = /login {
        limit_req zone=as4pur_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        limit_req zone=as4pur_general burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
