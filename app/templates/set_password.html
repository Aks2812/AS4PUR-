{% extends "base.html" %}
{% block title %}Set a New Password — {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Set a new password</h1>
  <p class="subtitle">An admin requires you to set a new password before you can continue.</p>

  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

  <form method="post" action="/set-password" class="stacked-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>New password
      <input type="password" name="password" autocomplete="new-password" required autofocus minlength="12">
    </label>
    <label>Confirm new password
      <input type="password" name="confirm_password" autocomplete="new-password" required minlength="12">
    </label>
    <p class="hint">At least 12 characters.</p>
    <button type="submit">Set password</button>
  </form>
</div>
{% endblock %}
